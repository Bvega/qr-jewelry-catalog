<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="canonical" id="canonicalLink" href="" />
  <link rel="stylesheet" href="styles.css" />

<body class="detail-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-link" href="index.html#home" aria-label="Between Us home">
        <img class="brand-mark" src="assets/brand/between-us-mark.svg" alt="" width="48" height="48" />
        <span class="brand-wordmark">
          <span class="brand-name">Between Us</span>
          <span class="brand-descriptor">Finds</span>
        </span>

      <nav class="site-nav" aria-label="Primary navigation">

    <a class="back-link" href="index.html#explore"><span aria-hidden="true">&larr;</span> Back to Explore</a>
