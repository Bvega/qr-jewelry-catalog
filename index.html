<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Ensures proper scaling on mobile screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewelry Catalog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>Jewelry Catalog</h1>
    <p>Handpicked boxed jewelry — browse available pieces below.</p>
  </header>

  <main>
    <!-- Product cards will be rendered into this container by app.js -->
    <section id="catalogGrid" aria-label="Jewelry catalog">
      <p class="catalog-placeholder">Loading jewelry items&hellip;</p>
    </section>
  </main>

  <footer>
    <p>Message to ask about availability or request a photo.</p>
  </footer>

  <!-- Load item data first so app.js can read window.JEWELRY_ITEMS -->
  <script src="data/items.js"></script>
  <script src="app.js"></script>

</body>
</html>
